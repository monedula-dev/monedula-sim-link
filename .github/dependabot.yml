# Keeps the Go modules and the SHA-pinned GitHub Actions current. One grouped
# PR per ecosystem per month, so pins do not go stale silently.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
